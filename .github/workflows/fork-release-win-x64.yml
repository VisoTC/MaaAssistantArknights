name: Fork ARPS Windows x64 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build. Leave empty to use the tag on upstream master-v2."
        required: false
        type: string
      force:
        description: "Recreate the fork release if it already exists."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-release-win-x64
  cancel-in-progress: false

jobs:
  prepare:
    name: Sync ARPS branch and select release tag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout ARPS branch
        uses: actions/checkout@v6
        with:
          ref: arps/master-v2
          fetch-depth: 0
          show-progress: false

      - name: Sync ARPS branch and prepare tag
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: "true"
          INPUT_TAG: ${{ inputs.tag }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          bash tools/fork/sync-arps-master-v2.sh

          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            upstream_head="$(git rev-parse upstream/master-v2)"
            tag="$(git tag --points-at "$upstream_head" --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "$tag" ]]; then
            echo "No upstream release tag found on upstream/master-v2."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1 && [[ "$FORCE_RELEASE" != "true" ]]; then
            echo "Release $tag already exists in this fork."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -d "$tag" >/dev/null 2>&1 || true
          git tag -a "$tag" -m "MAA-ARPS $tag" HEAD
          git push --force origin "refs/tags/$tag"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout ARPS branch
        uses: actions/checkout@v6
        with:
          ref: arps/master-v2
          show-progress: false

      - name: Fetch submodules
        shell: bash
        run: bash ./.github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils 3rdparty/EmulatorExtras

      - name: Cache MaaDeps
        id: cache-maadeps
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ./src/MaaUtils/MaaDeps
          key: ${{ runner.os }}-x64-maadeps-${{ hashFiles('tools/maadeps-download.py') }}

      - name: Bootstrap MaaDeps
        if: steps.cache-maadeps.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maadeps-download.py x64-windows

      - name: Configure, build and install
        run: |
          cmake -B build --preset windows-publish-x64 -DMAA_HASH_VERSION='${{ needs.prepare.outputs.tag }}'
          cmake --build --preset windows-publish-x64 --parallel $env:NUMBER_OF_PROCESSORS
          cmake --build build --target MAA.Updater --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install build --config RelWithDebInfo

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          tag: v5.9.2
          fileName: "*win-x86_64*.zip"
          extract: true
          out-file-path: MaaFramework-temp

      - name: Copy ControlUnits
        run: |
          cp MaaFramework-temp/bin/*Win32ControlUnit* install/
          cp MaaFramework-temp/bin/*AdbControlUnit* install/

      - name: Generate global.json
        shell: bash
        run: echo '{"sdk":{"version":"10.0.203","rollForward":"disable"}}' > global.json

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache .nuke/temp and NuGet packages
        id: cache-nuget
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-x64-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}

      - name: Restore dependencies
        if: steps.cache-nuget.outputs.cache-hit != 'true'
        run: dotnet restore src/MaaWpfGui/MaaWpfGui.csproj

      - name: Taggify version for csproj
        run: |
          $csprojPath = Resolve-Path -Path "src/MaaWpfGui/MaaWpfGui.csproj"
          $tag = '${{ needs.prepare.outputs.tag }}' -replace '.*?/', ''
          if ($tag -match '\d+(\.\d+){1,3}') {
              $match = $Matches[0]
          } else {
              $match = "0.0.1"
          }
          [xml]$csproj = Get-Content -Path $csprojPath
          $node = $csproj.Project.PropertyGroup | where {$_.ApplicationVersion -ne $null}
          $node.InformationalVersion = $tag
          $node.Version = $match
          $node.FileVersion = $match
          $node.AssemblyVersion = $match
          $csproj.Save($csprojPath)

      - name: Publish WPF GUI
        run: dotnet publish src/MaaWpfGui/MaaWpfGui.csproj -c Release -p:Platform=x64 -o install

      - name: Organize install files
        shell: bash
        run: |
          rm -rf install/*.pdb
          rm -rf install/msvc-debug
          rm -rf install/*.lib
          rm -rf install/*.exp
          rm -rf install/*.h
          rm -rf install/*.bak
          cp tools/DependencySetup_*.bat install/

      - name: Zip files
        run: |
          cd install
          Compress-Archive -Destination MAA-${{ needs.prepare.outputs.tag }}-win-x64.zip -Path ./*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: arps/master-v2
          name: MAA-ARPS ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: install/MAA-${{ needs.prepare.outputs.tag }}-win-x64.zip
