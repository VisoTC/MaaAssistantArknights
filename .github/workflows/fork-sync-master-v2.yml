name: Fork Sync master-v2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: fork-sync-master-v2
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master-v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master-v2
        uses: actions/checkout@v6
        with:
          ref: master-v2
          fetch-depth: 0
          show-progress: false

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MaaAssistantArknights/MaaAssistantArknights.git
          git fetch upstream master-v2
          before="$(git rev-parse HEAD)"
          git merge --no-edit upstream/master-v2
          after="$(git rev-parse HEAD)"
          if [[ "$before" != "$after" ]]; then
            git push origin HEAD:master-v2
          fi
