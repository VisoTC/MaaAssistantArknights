name: Fork ARPS Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-arps-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into ARPS branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARPS branch
        uses: actions/checkout@v6
        with:
          ref: arps/master-v2
          fetch-depth: 0
          show-progress: false

      - name: Sync upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: "true"
        run: |
          set -euo pipefail
          set +e
          bash tools/fork/sync-arps-master-v2.sh
          sync_status=$?
          set -e

          if [[ "$sync_status" -eq 2 ]]; then
            echo "Upstream conflicts were handed off to a draft pull request."
            exit 0
          fi

          exit "$sync_status"
