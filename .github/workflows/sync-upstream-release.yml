name: Sync Upstream Release

on:
  schedule:
    # Check frequently so forks can publish shortly after upstream does.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "Upstream repository to follow"
        required: false
        default: "MaaAssistantArknights/MaaAssistantArknights"
        type: string
      branch:
        description: "Branch to fast-forward from upstream before tagging"
        required: false
        default: "dev-v2"
        type: string
      tag:
        description: "Optional upstream release tag to sync; latest release is used when empty"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-upstream-release:
    name: Sync branch from upstream and publish matching release tag
    if: github.repository != (inputs.upstream_repository || 'MaaAssistantArknights/MaaAssistantArknights')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'MaaAssistantArknights/MaaAssistantArknights' }}
      TARGET_BRANCH: ${{ inputs.branch || 'dev-v2' }}
      REQUESTED_TAG: ${{ inputs.tag || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Resolve upstream release tag
        id: upstream
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag=$(gh release list --repo "$UPSTREAM_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          fi

          if [ -z "$tag" ]; then
            echo "No upstream release tag found in $UPSTREAM_REPOSITORY" >&2
            exit 1
          fi

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "already_synced=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "already_synced=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream branch
        if: steps.upstream.outputs.already_synced != 'true'
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --no-tags upstream "$TARGET_BRANCH:refs/remotes/upstream/$TARGET_BRANCH"

      - name: Merge upstream branch
        if: steps.upstream.outputs.already_synced != 'true'
        run: |
          git switch "$TARGET_BRANCH"
          git merge --no-edit "upstream/$TARGET_BRANCH"
          git push origin "$TARGET_BRANCH"

      - name: Create and push matching release tag
        if: steps.upstream.outputs.already_synced != 'true'
        run: |
          tag='${{ steps.upstream.outputs.tag }}'
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"

      - name: Trigger release pipeline when tag already existed
        if: steps.upstream.outputs.already_synced == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" ci.yml --ref '${{ steps.upstream.outputs.tag }}'
